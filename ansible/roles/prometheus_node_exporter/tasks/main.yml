---
- name: Ensure node_exporter group exists
  ansible.builtin.group:
    name: node_exporter
    state: present
    system: true

- name: Ensure node_exporter user exists
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Check if node_exporter is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_bin

- name: Download and unpack node_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not node_exporter_bin.stat.exists

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    owner: root
    group: root
    remote_src: true
  when: not node_exporter_bin.stat.exists

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Allow node_exporter port 9100 strictly from Control Plane IP
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "9100"
    source: "{{ control_plane_ip }}"
    jump: ACCEPT
    comment: "Allow Prometheus scrape from Control Plane"
  when: control_plane_ip is defined

- name: Ensure node_exporter service is enabled and running
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
